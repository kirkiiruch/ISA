services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - app_network

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0.0
    container_name: kb_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  ollama:
    image: ollama/ollama:latest
    container_name: kb_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app_network

  ollama-init:
    image: ollama/ollama:latest
    container_name: kb_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      -c "echo 'Pulling nomic-embed-text...' &&
          ollama pull nomic-embed-text &&
          echo 'Pulling llama3.2:3b...' &&
          ollama pull llama3.2:3b &&
          echo 'All models ready!'"
    restart: "no"
    networks:
      - app_network

volumes:
  mongodb_data:
  ollama_models:

networks:
  app_network:
    driver: bridge